   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="967.005938" transform="rotate(-0 32.4 967.005938)">Defaults: 40 particles; min 150 / max 1,000 iterations; improvement target 0.01; ω = 0.7; c₁ = c₂ = 1.6.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="986.445938" transform="rotate(-0 32.4 986.445938)">vmax = 0.2 × (upper − lower). r₁ and r₂ are independent random arrays shaped (swarm_size, 3).</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="1005.885937" transform="rotate(-0 32.4 1005.885937)">Stopping uses score improvement; success is checked separately using analytical |f − 2.4| ≤ 0.01 GHz and geometry.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(238.293211 129.390406)">Start timer and seeded RNG</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(216.390414 143.561969)">Compute velocity limits from bounds</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(229.824992 207.236969)">Sample positions and velocities</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(188.597266 222.386969)">Repair positions; evaluate objective per particle</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(209.250977 237.536969)">Initialize personal bests and global best</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(623.534141 200.640406)">Current runtime blocker</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(622.397102 214.811969)">40 × 3 swarm passed to</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(603.948031 229.821516)">repair_design() → RMA(*design)</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(660.090617 244.956523)">TypeError</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(269.821781 348.615406)">iteration &lt; max</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(258.225719 363.171242)">and (iteration &lt; min</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(220.842305 377.936969)">or relative improvement &gt; target)?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(174.120336 480.836969)">Update velocity with inertia, personal and global best</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(202.26225 495.986969)">v ← ωv + c₁r₁(pbest − x) + c₂r₂(gbest − x)</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(204.226227 511.136969)">Clip each component to [−vmax, +vmax]</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(245.618078 582.011969)">Move particles: x ← x + v</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(177.603258 597.161969)">Repair geometry; evaluate fixed surrogate objective</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(189.091219 668.036969)">Update each personal best if its score improves</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(202.339578 683.186969)">Update global best from all personal bests</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(189.669602 698.336969)">Append global best score and position histories</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(175.726078 772.811969)">Compute relative score improvement; iteration += 1</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(192.459727 787.843609)">(J_previous − J_best) / max(|J_previous|, 10⁻¹²)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(638.406391 348.615406)">Return PSO.Result</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(628.123328 362.786969)">Best design, histories,</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(617.465461 378.915406)">evaluation count and time</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(627.606492 483.921516)">Driver: verify_results()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(607.992766 499.211969)">Compute analytical frequency</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(600.488781 514.361969)">Check geometry and target error</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(608.28393 529.511969)">Compare surrogate prediction</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(602.180531 647.018508)">Driver: record histories / metrics</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(630.475523 662.565406)">Summarize NN vs GP</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(628.582562 676.736969)">Save comparison.json</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(180.451609 891.611969)">The continuation below initialization describes the intended loop after fixing the listed connections.</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(150.339406 906.621516)">Current compare_models() also records only the final seed because its reporting block is outside the seed loop.</text>
   </g>
