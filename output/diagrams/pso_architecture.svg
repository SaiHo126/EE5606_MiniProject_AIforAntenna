   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="748.845937" transform="rotate(-0 32.4 748.845937)">Intended score: J = W·L·h / 11250 + λ |f_predicted − 2.4|. main() sets λ = 1 and analytical tolerance = 0.01 GHz.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="768.285937" transform="rotate(-0 32.4 768.285937)">The network is fixed during search. Analytical target error and surrogate prediction error are separate quantities.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(101.206187 139.815406)">Saved NN and GP models</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(111.516078 154.371242)">NeuralNetwork.load()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(48.969461 169.136969)">GPRskeleton.GaussianProcessRegressor.load()</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(375.420672 138.696516)">main() → compare_models()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(390.630641 154.450148)">NN and GP; seeds 1–5</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(363.911406 169.136969)">Same bounds and score settings</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(676.607086 138.696516)">make_objective()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(645.634805 153.986969)">Volume + predicted-f penalty</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(650.669813 169.136969)">Calls model.predict(design)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(422.032961 297.840406)">PSO class</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(371.297031 311.871516)">initialize_swarm() / evaluate()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(357.874289 327.021516)">update_velocity() / move_particle()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(365.595266 342.311969)">run(): personal and global bests</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(102.329313 296.721516)">repair_design()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(89.073852 312.011969)">Clip bounds and use</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(92.219055 327.161969)">RMA.geometryFix()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(69.623461 342.311969)">Currently single-design only</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(707.169453 297.840406)">PSO.Result</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(686.378445 312.011969)">Best design / score</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(670.601141 328.140406)">Position + score histories</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(686.272711 343.290406)">Evaluations + time</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(373.075578 462.321516)">verify_results(design, model)</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(348.427633 477.611969)">Surrogate prediction vs analytical RMA</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(370.335953 492.761969)">Target error + prediction error</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(357.737781 507.911969)">Geometry and frequency tolerance</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(683.271906 462.461969)">Comparison outputs</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(702.011352 477.611969)">History CSVs</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(692.984477 492.761969)">comparison.json</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(683.357914 508.890406)">Success rate + time</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(361.049078 624.086969)">Current integration blockers</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(275.191977 639.096516)">1. compare_models passes object instead of objective to PSO.</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(201.059555 654.246516)">2. initialize_swarm and move_particle pass (swarm_size, 3) arrays to a single-design repair.</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(230.318781 669.536969)">3. evaluate builds an object array from a generator; it never calls self.objective.</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(196.726813 684.686969)">4. Verification and saving sit outside the seed loop, so only the final seed would be recorded.</text>
   </g>
