   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="1003.005938" transform="rotate(-0 32.4 1003.005938)">__main__: at most 50,000 epochs; best validation RMSE &lt; 10 kHz; patience = 2,000 epochs without improvement.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="1022.445938" transform="rotate(-0 32.4 1022.445938)">fit() also supports minibatches and fixed-rate gradient updates when line_search=False; these are not the main path.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="1041.885938" transform="rotate(-0 32.4 1041.885938)">The test split is evaluated after training. Line search itself applies the accepted update; there is no second update.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(230.515227 128.271516)">Load antennaSample_training.npz</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(199.751258 143.561969)">Use saved training, validation and test indices</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(221.797664 211.596242)">Initialize 3 → 32 → 1 network (seed 1)</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(238.207797 226.361969)">Xavier weights and zero biases</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(180.354523 294.011969)">Fit X and Y mean / standard deviation on training only</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(219.959148 309.161969)">Transform training and validation data</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(219.11643 380.411969)">Forward pass on the full training batch</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(201.1045 395.561969)">Manual backpropagation of standardized MSE</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(200.783352 462.836969)">Search along d = −gradient; initial step α = 1</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(189.570773 478.371242)">Double trial α to bracket; bisect (zoom) as needed</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(177.549406 493.136969)">Accept sufficient decrease AND Strong Wolfe curvature</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(643.390305 470.256523)">Nonzero step</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(650.865094 485.561969)">accepted?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(626.59432 599.636969)">Flag stalled training</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(613.555063 615.765406)">On RuntimeError: restore</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(619.028789 629.936969)">pre-search parameters</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(185.885063 599.636969)">Evaluate current training and validation MSE (GHz²)</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(203.363586 614.786969)">Append loss histories; if validation improves:</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(233.461586 629.936969)">save best parameters and epoch</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(261.640586 725.636969)">Target RMSE reached,</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(245.253336 740.786969)">patience exhausted, stalled,</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(257.19343 755.936969)">or epoch limit reached?</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17344b" x="316.8" y="855.986969" transform="rotate(-0 316.8 855.986969)">Restore the best validation parameters; return history</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(195.125773 927.236969)">Save NPZ model and training plot; reload model</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(206.601109 942.386969)">Evaluate held-out test designs against RMA</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(170.77057 957.536969)">Save comparison plots, predictions CSV and metrics JSON</text>
   </g>
