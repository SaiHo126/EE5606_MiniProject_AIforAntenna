   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="938.205937" transform="rotate(-0 32.4 938.205937)">Relative change = |J_current − J_previous| / |J_previous|; this is score stagnation, not frequency acceptance.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="957.645937" transform="rotate(-0 32.4 957.645937)">There is no maximum-generation cap. Defaults shown by __main__: population 6, minimum 100 generations, 1 elite.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="977.085937" transform="rotate(-0 32.4 977.085937)">Crossover probability 0.8; per-gene mutation probability 0.2; mutation scale = 0.1 × each dimension's range.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="324" y="129.250148" transform="rotate(-0 324 129.250148)">Start timer; create seeded GA instance</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(212.708258 200.411969)">Initialize population of RMA antenna objects</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(190.446438 215.561969)">Repair dimensions; calculate analytical f and volume</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(197.788664 283.211969)">Evaluate initial population; record minimum score</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(212.383953 298.361969)">Set generation = 0 and relative change = ∞</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(239.213656 366.011969)">Sort current population by fitness</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(224.48107 381.161969)">Copy unique elites into next population</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(237.662359 452.036969)">Select two parents by tournament</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(225.933734 467.186969)">Blend genes with crossover probability</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(226.143625 482.336969)">Mutate each gene with Gaussian noise</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(240.174734 552.836969)">Clip bounds and repair W/L ≥ 1.2</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(204.206109 567.986969)">If duplicate: try a fresh repaired random design</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(206.404438 583.136969)">Append unseen children until population is full</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(643.067773 560.411969)">Population</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(659.135453 576.540406)">full?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(184.994805 664.811969)">Evaluate new population; record its best design / score</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(227.611281 679.961969)">Append history; increment generation</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(249.330227 780.011969)">Generation ≥ generationsMin</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(252.288422 795.161969)">and relative change &lt; 0.01?</text>
   </g>
