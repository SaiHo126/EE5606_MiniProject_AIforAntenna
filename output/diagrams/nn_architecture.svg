   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="676.845937" transform="rotate(-0 32.4 676.845937)">N is the number of samples. forward() accepts standardized arrays (N, 3); predict() accepts a single raw-mm design.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="696.285937" transform="rotate(-0 32.4 696.285937)">hiddenSize is configurable; 32 is the value in __main__. Array operations use CuPy if available, otherwise NumPy.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(126.369586 142.436969)">Design input</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(99.943094 157.446516)">[W_mm, L_mm, h_mm]</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(89.203164 172.736969)">Public predict(): one design</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(384.638891 142.436969)">Standardize inputs</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(362.084328 157.446516)">X_s = (X − X_mean) / X_std</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(366.133797 172.736969)">Training-set statistics only</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(646.385594 142.436969)">32-neuron hidden layer</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(611.185516 157.446516)">H = tanh(W_hidden X_sᵀ + B_hidden)</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(664.297312 172.736969)">H shape: (32, N)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(648.650992 300.836969)">1-neuron linear output</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(624.369172 315.840992)">Y_s = (W_output H + B_output)ᵀ</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(663.067953 330.996516)">Y_s shape: (N, 1)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(361.021461 300.836969)">Undo target standardization</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(352.107422 315.846516)">Y_GHz = Y_s × Y_std + Y_mean</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(361.575383 331.136969)">Saved training-set statistics</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(79.980602 300.836969)">Predicted resonance frequency</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(81.315695 315.986969)">predict() returns a float in GHz</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(82.100023 331.136969)">Used as a fixed PSO surrogate</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(223.267375 466.061969)">Training: fit()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(141.105453 481.211969)">Training / validation split → standardized MSE</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(138.417117 496.361969)">Manual backward() → Strong Wolfe line search</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(135.944195 511.511969)">Restore weights from the best validation epoch</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(593.0275 466.061969)">Trainable weights and biases</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(574.348023 481.071516)">W_hidden: (32, 3); B_hidden: (32, 1)</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(578.894602 496.215992)">W_output: (1, 32); B_output: (1, 1)</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(604.102781 512.401242)">96 + 32 + 32 + 1 = 161</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17344b" x="432" y="618.386969" transform="rotate(-0 432 618.386969)">save() / load(): NPZ weights, scaling, settings and training histories</text>
   </g>
