   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="556.605937" transform="rotate(-0 32.4 556.605937)">Fitness: J = W·L·h / 11250 + λ |f_analytical − 2.4|. Frequency is in GHz; volume is in mm³.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="576.045937" transform="rotate(-0 32.4 576.045937)">Current config constructor forces λ = 1 and terminationCondition = 0.01, ignoring the supplied values.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526578" x="32.4" y="595.485937" transform="rotate(-0 32.4 595.485937)">The __main__ driver repeats ten seeds, plots histories, and displays the lowest-fitness final result.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(88.014344 139.211969)">Bounds + config + RNG seed</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(85.382031 154.361969)">Design genes: [W, L, h] in mm</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(373.758508 139.211969)">GeneticAlgorithm.run()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(341.098422 154.361969)">Population and convergence control</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(685.083289 140.190406)">results</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(632.586961 154.361969)">Design, score, history, time</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(110.479742 275.636969)">initializePopulation()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(80.19868 290.786969)">Uniform sampling within bounds</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(97.268469 305.936969)">Repair antenna geometry</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(368.325813 275.496516)">create_next_generation()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(369.218242 290.786969)">Unique elites + offspring</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(358.827078 305.936969)">Replace duplicates randomly</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(654.784867 287.040406)">PatchFormula.RMA</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(624.116375 301.211969)">Analytical frequency + volume</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(638.544383 316.361969)">fitness() + geometryFix()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(635.040156 332.093508)">W/L ≥ 1.2 and box bounds</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(256.576 437.496516)">select_parent() → crossover() → mutate()</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(230.084805 452.786969)">Tournament → arithmetic blend → Gaussian change</text>
    <text style="font-size: 10.1px; font-family: 'DejaVu Sans'; fill: #17344b" transform="translate(255.575469 467.936969)">Clip genes, repair geometry, refresh RMA</text>
